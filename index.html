<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavingsZen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <h1 class="logo">SavingsZen</h1>
            <button class="btn-primary">Add New Goal</button>
        </div>
    </header>

    <main class="container">
        <section class="summary-card">
            <p class="summary-label">TOTAL SAVINGS</p>
            <h2 class="summary-amount">4,850.00 PLN</h2>
        </section>

        <section class="goals-section">
            <h3 class="section-title">Active Goals</h3>
            
            <div class="goals-grid">
                <article class="goal-card">
                    <div class="card-header">
                        <h4>Alps Vacation</h4>
                        <span class="badge badge-travel">Travel</span>
                    </div>
                    <div class="card-amounts">
                        <span class="current">1,200.00</span>
                        <span class="target">3,000.00</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: 40%; background-color: #0b8a00;"></div>
                    </div>
                    <div class="card-footer">
                        <span class="percentage">40%</span>
                    </div>
                </article>

                <article class="goal-card">
                    <div class="card-header">
                        <h4>New Laptop</h4>
                        <span class="badge badge-tech">Tech</span>
                    </div>
                    <div class="card-amounts">
                        <span class="current">4,500.00</span>
                        <span class="target">6,000.00</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: 75%; background-color: #0b8a00;"></div>
                    </div>
                    <div class="card-footer">
                        <span class="percentage">75%</span>
                    </div>
                </article>
            </div>
        </section>
    </main>

</body>
</html>
